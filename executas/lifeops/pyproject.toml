[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-lifeops"
version = "0.3.0"
description = "LifeOps AI Action Planner — Executa plugin for Anna App"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
"tool-dev-lifeops" = "lifeops_plugin:main"

[tool.setuptools]
py-modules = ["lifeops_plugin"]
